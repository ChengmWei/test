<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI3 南港美食 3D 午餐選擇器</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ========== 1. CSS Reset & Canvas 全螢幕佈局 ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: #f4f6ff;
      background: radial-gradient(ellipse at 70% 40%, #2a2f5a 0%, #141629 55%, #0b0c18 100%);
    }
    #canvas-container { position: fixed; inset: 0; z-index: 0; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    #canvas-container canvas { display: block; }

    /* ========== 2. 控制面板 UI (Glassmorphism) ========== */
    #ui-container { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    header {
      pointer-events: auto;
      margin: 16px 16px 0;
      padding: 14px 22px;
      border-radius: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
    header h1 span { color: #ffcf5c; }
    header .sub { margin-left: auto; font-size: 13px; opacity: .7; }

    #filter-panel {
      pointer-events: auto;
      width: 320px;
      margin: 16px;
      padding: 22px;
      border-radius: 20px;
      overflow-y: auto;
      max-height: calc(100% - 110px);
      display: flex; flex-direction: column; gap: 20px;
    }
    .group-title { font-size: 13px; font-weight: 600; opacity: .75; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .group-title i { color: #ffcf5c; width: 16px; text-align: center; }

    .seg { display: flex; gap: 6px; }
    .seg label { flex: 1; }
    .seg input { display: none; }
    .seg span {
      display: block; text-align: center; padding: 9px 4px; border-radius: 10px; font-size: 14px; cursor: pointer;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); transition: all .2s;
    }
    .seg span small { display: block; font-size: 10.5px; opacity: .6; margin-top: 2px; }
    .seg input:checked + span { background: linear-gradient(135deg, #ff8a5c, #ff5c8a); border-color: transparent; font-weight: 600; }
    .seg input:checked + span small { opacity: .9; }

    .toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; user-select: none; }
    .toggle input { display: none; }
    .toggle .switch { width: 42px; height: 24px; border-radius: 12px; background: rgba(255,255,255,.18); position: relative; transition: background .2s; flex-shrink: 0; }
    .toggle .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle input:checked + .switch { background: #3ecf8e; }
    .toggle input:checked + .switch::after { transform: translateX(18px); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips input { display: none; }
    .chips span {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 999px; font-size: 13.5px; cursor: pointer; user-select: none;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); transition: all .2s;
    }
    .chips input:checked + span { background: rgba(255, 207, 92, .2); border-color: #ffcf5c; color: #ffe39e; }
    .chips-actions { margin-top: 8px; font-size: 12px; opacity: .7; }
    .chips-actions a { color: #9fc1ff; cursor: pointer; text-decoration: underline; margin-right: 10px; }

    .count-box { padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.22); font-size: 14px; display: flex; align-items: center; gap: 10px; }
    .count-box b { font-size: 22px; color: #ffcf5c; }
    .count-box.empty b { color: #ff6b6b; }
    .hint { font-size: 12.5px; color: #ff9d9d; margin-top: 6px; min-height: 1em; }

    .btn {
      border: none; cursor: pointer; font: inherit; color: #fff;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 14px; transition: transform .15s, filter .15s, opacity .2s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .35; cursor: not-allowed; filter: grayscale(.6); }
    .btn-primary { padding: 15px; font-size: 17px; font-weight: 700; width: 100%; background: linear-gradient(135deg, #ff8a5c, #ff5c8a); box-shadow: 0 6px 20px rgba(255, 92, 138, .4); }
    .btn-ghost { padding: 11px 14px; font-size: 14px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); }
    .btn-map { padding: 13px; font-size: 15px; font-weight: 600; background: linear-gradient(135deg, #3ecf8e, #2aa3d8); text-decoration: none; }

    #mobile-toggle { display: none; }
    #spin-tip { position: fixed; bottom: 20px; right: 24px; z-index: 5; font-size: 12px; opacity: .45; pointer-events: none; }

    /* ========== 3. 結果彈窗與按鈕樣式 ========== */
    #result-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(5, 6, 15, .55); transition: opacity .3s; }
    #result-modal.hidden { opacity: 0; pointer-events: none; }
    #result-modal .card {
      width: min(420px, calc(100% - 32px)); padding: 28px 26px 22px; border-radius: 24px; text-align: center;
      background: rgba(30, 33, 64, .78); transform: scale(1); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1);
    }
    #result-modal.hidden .card { transform: scale(.85); }
    .card .eyebrow { font-size: 13px; letter-spacing: 2px; opacity: .65; }
    .card h2 { font-size: 26px; margin: 10px 0 6px; line-height: 1.3; color: #ffe39e; }
    .card .meta { font-size: 14.5px; opacity: .85; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .card .meta i { color: #ffcf5c; margin-right: 4px; }
    .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .tag { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); }
    .tag.ac { background: rgba(62, 207, 142, .18); border-color: #3ecf8e; }
    .tag.noac { background: rgba(255, 140, 92, .15); border-color: #ff8a5c; }
    .card .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card .actions .btn-map { grid-column: 1 / -1; }

    #webgl-error { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; text-align: center; padding: 40px; font-size: 15px; opacity: .8; }

    /* ========== RWD：手機版改為底部抽屜 ========== */
    @media (max-width: 760px) {
      header { margin: 10px 10px 0; padding: 11px 14px; }
      header h1 { font-size: 16px; }
      header .sub { display: none; }
      #filter-panel {
        position: fixed; left: 0; right: 0; bottom: 0; width: auto; margin: 0;
        border-radius: 22px 22px 0 0; max-height: 72%;
        transform: translateY(calc(100% - 132px)); transition: transform .35s ease;
        padding-top: 14px;
      }
      #filter-panel.open { transform: translateY(0); }
      #mobile-toggle { display: flex; justify-content: center; margin: -4px 0 -6px; }
      #mobile-toggle button { background: none; border: none; color: #fff; opacity: .7; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
      #mobile-toggle .bar { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.4); }
      .mobile-order-first { order: -1; }
      #spin-tip { display: none; }
    }
  </style>
  <!-- 引進 Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D 畫布容器 -->
  <div id="canvas-container"></div>
  <div id="webgl-error"><div><i class="fa-solid fa-triangle-exclamation" style="font-size:32px;color:#ffcf5c"></i><p style="margin-top:12px">您的瀏覽器未啟用 WebGL 或 Three.js 載入失敗，<br>請改用最新版 Chrome / Edge / Safari / Firefox 並確認網路連線。</p></div></div>
  <div id="spin-tip"><i class="fa-regular fa-hand"></i> 可拖曳轉盤改變視角</div>

  <!-- 前端篩選 UI 層 -->
  <div id="ui-container">
    <header class="glass">
      <i class="fa-solid fa-utensils" style="color:#ffcf5c;font-size:20px"></i>
      <h1>AI3 南港午餐 <span>3D</span> 決策器</h1>
      <div class="sub"><i class="fa-solid fa-location-dot"></i> 南港軟體園區・三重路 半徑 2km</div>
    </header>

    <aside id="filter-panel" class="glass">
      <div id="mobile-toggle"><button type="button" id="drawer-btn"><span class="bar"></span><span id="drawer-label">展開篩選條件</span></button></div>

      <div class="mobile-order-first" style="display:flex;flex-direction:column;gap:10px">
        <div class="count-box" id="count-box"><i class="fa-solid fa-store"></i><span>符合條件：<b id="match-count">0</b> 家</span></div>
        <button class="btn btn-primary" id="spin-btn"><i class="fa-solid fa-dice"></i> 決定吃什麼！</button>
        <div class="hint" id="hint"></div>
      </div>

      <section>
        <div class="group-title"><i class="fa-solid fa-person-walking"></i>距離選擇</div>
        <div class="seg" id="distance-group">
          <label><input type="radio" name="distance" value="500"><span>500m<small>園區內・步行5分</small></span></label>
          <label><input type="radio" name="distance" value="1000"><span>1km<small>南港站周邊</small></span></label>
          <label><input type="radio" name="distance" value="2000" checked><span>2km<small>昆陽/汐止交界</small></span></label>
        </div>
      </section>

      <section>
        <div class="group-title"><i class="fa-solid fa-snowflake"></i>環境條件</div>
        <label class="toggle"><input type="checkbox" id="ac-check" checked><span class="switch"></span>必須有冷氣</label>
      </section>

      <section>
        <div class="group-title"><i class="fa-solid fa-bowl-food"></i>食物種類</div>
        <div class="chips" id="cat-group"></div>
        <div class="chips-actions"><a id="cat-all">全選</a><a id="cat-none">全不選</a></div>
      </section>
    </aside>
  </div>

  <!-- 結果彈窗層 -->
  <div id="result-modal" class="hidden">
    <div class="card glass">
      <div class="eyebrow">🎉 今天午餐就吃</div>
      <h2 id="r-name">—</h2>
      <div class="meta">
        <span><i class="fa-solid fa-route"></i><span id="r-dist"></span></span>
        <span><i class="fa-solid fa-coins"></i><span id="r-price"></span></span>
      </div>
      <div class="tags" id="r-tags"></div>
      <div class="actions">
        <a class="btn btn-map" id="r-map" target="_blank" rel="noopener"><i class="fa-solid fa-map-location-dot"></i> 開啟 Google 地圖導航</a>
        <button class="btn btn-ghost" id="r-again"><i class="fa-solid fa-rotate-right"></i> 不滿意，再抽一次</button>
        <button class="btn btn-ghost" id="r-refilter"><i class="fa-solid fa-sliders"></i> 重新篩選</button>
      </div>
    </div>
  </div>

  <script>
  /* =====================================================================
   * 1. 餐廳資料庫 (AI3 方圓 2km 內清單)
   *    distanceMeters 為以南港軟體園區（三重路）為起點的估計步行距離，
   *    請依實際情況校正；新增餐廳只要照格式加一筆即可。
   *    categories 可用值：麵 / 飯 / 鍋貼/水餃 / 漢堡/美式 / 小吃 / 健康餐/沙拉
   * ===================================================================== */
  const ORIGIN_QUERY = '南港軟體園區 台北市南港區三重路';
  const mapUrl = (q) => 'https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=' +
    encodeURIComponent(ORIGIN_QUERY) + '&destination=' + encodeURIComponent(q);

  const RESTAURANTS = [
    { id: 'rest_001', name: '樂法 Le Phu',                 distanceMeters: 300,  hasAC: true,  categories: ['漢堡/美式', '健康餐/沙拉'], priceRange: '$' },
    { id: 'rest_002', name: '朱記餡餅粥店 (南港環球店)',    distanceMeters: 1200, hasAC: true,  categories: ['麵', '飯', '鍋貼/水餃'],   priceRange: '$$' },
    { id: 'rest_003', name: '軟體園區美食街',              distanceMeters: 150,  hasAC: true,  categories: ['飯', '麵', '小吃'],        priceRange: '$' },
    { id: 'rest_004', name: 'Subway (南港軟體園區)',        distanceMeters: 300,  hasAC: true,  categories: ['健康餐/沙拉', '漢堡/美式'], priceRange: '$$' },
    { id: 'rest_005', name: '八方雲集 (南港三重路)',        distanceMeters: 350,  hasAC: false, categories: ['鍋貼/水餃', '麵'],         priceRange: '$' },
    { id: 'rest_006', name: '摩斯漢堡 (南港園區)',          distanceMeters: 400,  hasAC: true,  categories: ['漢堡/美式'],               priceRange: '$$' },
    { id: 'rest_007', name: '拉亞漢堡 (南港三重路)',        distanceMeters: 450,  hasAC: false, categories: ['漢堡/美式'],               priceRange: '$' },
    { id: 'rest_008', name: '池上便當 (南港)',              distanceMeters: 600,  hasAC: false, categories: ['飯'],                      priceRange: '$' },
    { id: 'rest_009', name: '麥當勞 (南港經貿)',            distanceMeters: 700,  hasAC: true,  categories: ['漢堡/美式'],               priceRange: '$' },
    { id: 'rest_010', name: '四海遊龍 (南港)',              distanceMeters: 900,  hasAC: false, categories: ['鍋貼/水餃', '麵'],         priceRange: '$' },
    { id: 'rest_011', name: 'すき家 Sukiya (南港)',         distanceMeters: 1000, hasAC: true,  categories: ['飯'],                      priceRange: '$' },
    { id: 'rest_012', name: '三商巧福 (南港)',              distanceMeters: 1000, hasAC: true,  categories: ['麵', '飯'],                priceRange: '$' },
    { id: 'rest_013', name: '吉野家 (南港車站)',            distanceMeters: 1100, hasAC: true,  categories: ['飯'],                      priceRange: '$' },
    { id: 'rest_014', name: '鬍鬚張魯肉飯 (南港)',          distanceMeters: 1100, hasAC: true,  categories: ['飯', '小吃'],              priceRange: '$' },
    { id: 'rest_015', name: 'CITYLINK 南港 美食街',         distanceMeters: 1150, hasAC: true,  categories: ['麵', '飯', '小吃'],        priceRange: '$$' },
    { id: 'rest_016', name: '爭鮮迴轉壽司 (CITYLINK 南港)', distanceMeters: 1150, hasAC: true,  categories: ['飯'],                      priceRange: '$$' },
    { id: 'rest_017', name: '環球購物中心 南港店 美食街',   distanceMeters: 1200, hasAC: true,  categories: ['麵', '飯', '小吃'],        priceRange: '$$' },
    { id: 'rest_018', name: 'LaLaport 南港 美食街',         distanceMeters: 1300, hasAC: true,  categories: ['麵', '飯', '小吃', '漢堡/美式'], priceRange: '$$' },
    { id: 'rest_019', name: '大戶屋 (LaLaport 南港)',       distanceMeters: 1300, hasAC: true,  categories: ['飯', '健康餐/沙拉'],       priceRange: '$$$' },
    { id: 'rest_020', name: '南港展覽館 美食區',            distanceMeters: 1500, hasAC: true,  categories: ['飯', '麵', '漢堡/美式'],   priceRange: '$$' },
    { id: 'rest_021', name: '南港老街・市場周邊小吃',       distanceMeters: 1600, hasAC: false, categories: ['小吃', '麵', '鍋貼/水餃'], priceRange: '$' },
    { id: 'rest_022', name: '昆陽站周邊小吃',              distanceMeters: 1900, hasAC: false, categories: ['小吃', '麵', '飯'],        priceRange: '$' }
  ].map(r => ({ ...r, googleMapUrl: r.googleMapUrl || mapUrl(r.name.replace(/[()]/g, ' ')) }));

  const CATEGORIES = [
    { key: '麵',         icon: '🍜' },
    { key: '飯',         icon: '🍚' },
    { key: '鍋貼/水餃',  icon: '🥟' },
    { key: '漢堡/美式',  icon: '🍔' },
    { key: '小吃',       icon: '🍢', label: '其他/小吃' },
    { key: '健康餐/沙拉', icon: '🥗' }
  ];
  const PALETTE = [0xff6b6b, 0xffa94d, 0xffd43b, 0x69db7c, 0x38d9a9, 0x4dabf7, 0x748ffc, 0xda77f2, 0xf783ac, 0x20c997];

  /* =====================================================================
   * DOM 參照
   * ===================================================================== */
  const $ = (id) => document.getElementById(id);
  const catGroup = $('cat-group');
  CATEGORIES.forEach(c => {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" value="${c.key}" checked><span>${c.icon} ${c.label || c.key}</span>`;
    catGroup.appendChild(l);
  });

  /* =====================================================================
   * 2. Three.js 場景、相機、渲染器、燈光初始化
   * ===================================================================== */
  const container = $('canvas-container');
  let renderer, scene, camera;
  const hasThree = typeof THREE !== 'undefined';
  try {
    if (!hasThree) throw new Error('three missing');
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    $('webgl-error').style.display = 'flex';
  }

  const R = 3;                 // 輪盤半徑
  let wheelGroup, holder, pointer, hubMat, confetti;
  let currentList = [];
  let sectorMeshes = [];

  if (renderer) {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 11);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(4, 6, 8);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0x8fa8ff, 0.4);
    rim.position.set(-6, -3, 4);
    scene.add(rim);

    // holder：負責傾斜 / 拖曳視角；wheelGroup：負責轉動
    holder = new THREE.Group();
    holder.rotation.x = -0.28;
    scene.add(holder);
    wheelGroup = new THREE.Group();
    holder.add(wheelGroup);

    // 外框圓環
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(R + 0.1, 0.12, 16, 120),
      new THREE.MeshStandardMaterial({ color: 0xffcf5c, metalness: 0.7, roughness: 0.3 })
    );
    ring.position.z = 0.15;
    holder.add(ring);

    // 底座背板
    const back = new THREE.Mesh(
      new THREE.CylinderGeometry(R + 0.25, R + 0.25, 0.2, 96),
      new THREE.MeshStandardMaterial({ color: 0x1d2040, metalness: 0.3, roughness: 0.6 })
    );
    back.rotation.x = Math.PI / 2;
    back.position.z = -0.12;
    holder.add(back);

    // 中心軸
    hubMat = new THREE.MeshStandardMaterial({ color: 0xffcf5c, metalness: 0.8, roughness: 0.25, emissive: 0x000000 });
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.5, 48), hubMat);
    hub.rotation.x = Math.PI / 2;
    hub.position.z = 0.3;
    holder.add(hub);
    const hubCap = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.5, roughness: 0.2 }));
    hubCap.position.z = 0.58;
    holder.add(hubCap);

    // 指針（固定在頂端，朝下）
    pointer = new THREE.Group();
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.28, 0.75, 32),
      new THREE.MeshStandardMaterial({ color: 0xff3b5c, metalness: 0.4, roughness: 0.35 })
    );
    cone.rotation.z = Math.PI;
    cone.position.y = -0.2;
    pointer.add(cone);
    const pin = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.6, roughness: 0.2 }));
    pin.position.y = 0.18;
    pointer.add(pin);
    pointer.position.set(0, R + 0.42, 0.45);
    holder.add(pointer);

    confetti = createConfetti();
  }

  // 依側欄寬度把 3D 畫面中心往右推，讓輪盤落在可見區域中央
  function layoutCamera() {
    if (!renderer) return;
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    const mobile = w <= 760;
    if (mobile) {
      camera.setViewOffset(w, h, 0, h * 0.09, w, h);   // 手機：往上推，避開底部抽屜
      camera.position.z = w < h ? 14.5 : 11;
    } else {
      const shift = (320 + 32) / 2;
      camera.setViewOffset(w, h, -shift, -20, w, h);
      camera.position.z = 11;
    }
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', layoutCamera);
  layoutCamera();

  /* =====================================================================
   * 3. 動態 3D 輪盤生成邏輯 (Canvas 動態繪製文字貼圖)
   * ===================================================================== */
  function makeTextTexture(text, colorHex) {
    const cvs = document.createElement('canvas');
    cvs.width = 1024; cvs.height = 192;
    const ctx = cvs.getContext('2d');
    let size = 92;
    ctx.font = `700 ${size}px -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif`;
    while (ctx.measureText(text).width > cvs.width - 60 && size > 36) {
      size -= 4;
      ctx.font = `700 ${size}px -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif`;
    }
    // 名稱太長則截斷
    let t = text;
    while (ctx.measureText(t).width > cvs.width - 60 && t.length > 2) t = t.slice(0, -2) + '…';
    // 依扇區底色決定字色
    const c = new THREE.Color(colorHex);
    const lum = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
    ctx.fillStyle = lum > 0.62 ? '#1d1f33' : '#ffffff';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = lum > 0.62 ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.35)';
    ctx.shadowBlur = 6;
    ctx.fillText(t, cvs.width - 30, cvs.height / 2 + 4);
    const tex = new THREE.CanvasTexture(cvs);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  function disposeGroup(g) {
    while (g.children.length) {
      const o = g.children.pop();
      o.traverse(n => {
        if (n.geometry) n.geometry.dispose();
        if (n.material) {
          if (n.material.map) n.material.map.dispose();
          n.material.dispose();
        }
      });
    }
  }

  function buildWheel(list) {
    if (!renderer) return;
    disposeGroup(wheelGroup);
    sectorMeshes = [];
    currentList = list.slice();
    const n = list.length;

    if (n === 0) {
      // 空盤：灰色圓盤 + 問號
      const empty = new THREE.Mesh(
        new THREE.CylinderGeometry(R, R, 0.25, 96),
        new THREE.MeshStandardMaterial({ color: 0x3a3e63, roughness: 0.8 })
      );
      empty.rotation.x = Math.PI / 2;
      wheelGroup.add(empty);
      return;
    }

    const a = (Math.PI * 2) / n;
    list.forEach((rest, i) => {
      const color = PALETTE[i % PALETTE.length];
      // 若最後一片與第一片同色，換一個顏色
      const finalColor = (i === n - 1 && n > 1 && i % PALETTE.length === 0) ? PALETTE[3] : color;

      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.absarc(0, 0, R, i * a, (i + 1) * a, false);
      shape.lineTo(0, 0);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.22, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.02, bevelSegments: 2,
        curveSegments: Math.max(6, Math.ceil(96 / n))
      });
      const mat = new THREE.MeshStandardMaterial({ color: finalColor, roughness: 0.45, metalness: 0.1, emissive: 0x000000 });
      const mesh = new THREE.Mesh(geo, mat);
      wheelGroup.add(mesh);
      sectorMeshes.push(mesh);

      // 文字貼圖：沿半徑方向排列
      const mid = (i + 0.5) * a;
      const inner = 0.62, outer = R - 0.18;
      let w = outer - inner;
      let h = w * (192 / 1024);
      const rMid = (inner + outer) / 2;
      const maxH = 2 * (inner + w * 0.25) * Math.sin(Math.min(a, Math.PI) / 2) * 0.9;
      if (n > 1 && h > maxH) { h = maxH; }
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: makeTextTexture(rest.name, finalColor), transparent: true, depthWrite: false })
      );
      plane.position.set(Math.cos(mid) * rMid, Math.sin(mid) * rMid, 0.27);
      plane.rotation.z = mid;
      wheelGroup.add(plane);

      // 分隔釘
      const peg = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 12, 10),
        new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.6, roughness: 0.3 })
      );
      peg.position.set(Math.cos(i * a) * (R - 0.08), Math.sin(i * a) * (R - 0.08), 0.3);
      wheelGroup.add(peg);
    });
  }

  /* =====================================================================
   * 4. 篩選條件過濾邏輯
   * ===================================================================== */
  function getFilters() {
    return {
      maxDist: Number(document.querySelector('input[name="distance"]:checked').value),
      needAC: $('ac-check').checked,
      cats: [...catGroup.querySelectorAll('input:checked')].map(i => i.value)
    };
  }
  function filterRestaurants(f) {
    return RESTAURANTS.filter(r =>
      r.distanceMeters <= f.maxDist &&
      (!f.needAC || r.hasAC) &&
      r.categories.some(c => f.cats.includes(c))
    );
  }

  let spinning = false;
  function refresh() {
    if (spinning) return;
    const f = getFilters();
    const list = filterRestaurants(f);
    $('match-count').textContent = list.length;
    $('count-box').classList.toggle('empty', list.length === 0);
    $('spin-btn').disabled = list.length === 0;
    let hint = '';
    if (f.cats.length === 0) hint = '請至少選擇一種食物類型。';
    else if (list.length === 0) hint = '沒有符合條件的餐廳，試試放寬距離或取消「必須有冷氣」。';
    else if (list.length === 1) hint = '只剩 1 家，其實不用抽了 😆';
    $('hint').textContent = hint;
    buildWheel(list);
    saveFilters(f);
  }

  // 篩選條件存到 LocalStorage，下次開啟沿用
  const LS_KEY = 'ai3-lunch-picker-filters';
  function saveFilters(f) { try { localStorage.setItem(LS_KEY, JSON.stringify(f)); } catch (e) {} }
  function loadFilters() {
    try {
      const f = JSON.parse(localStorage.getItem(LS_KEY));
      if (!f) return;
      const radio = document.querySelector(`input[name="distance"][value="${f.maxDist}"]`);
      if (radio) radio.checked = true;
      $('ac-check').checked = !!f.needAC;
      catGroup.querySelectorAll('input').forEach(i => { i.checked = f.cats.includes(i.value); });
    } catch (e) {}
  }

  /* =====================================================================
   * 5. 轉動動畫與 Ease-Out 演算法
   * ===================================================================== */
  const SPIN_MS = 3000;
  const easeOutQuart = (t) => 1 - Math.pow(1 - t, 4);
  let spin = null;            // { start, from, to, index }
  let lastTickSector = -1;
  let pointerKick = 0;
  let audioCtx = null;

  function tickSound() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = 1400;
      g.gain.setValueAtTime(0.05, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
      o.connect(g).connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.05);
    } catch (e) {}
  }

  function startSpin() {
    if (spinning || currentList.length === 0) return;
    hideModal();
    const n = currentList.length;
    const a = (Math.PI * 2) / n;
    const index = Math.floor(Math.random() * n);
    const jitter = (Math.random() - 0.5) * a * 0.6;
    // 指針在 +Y（角度 π/2），讓扇區中心角 + 旋轉角 = π/2
    const target = Math.PI / 2 - ((index + 0.5) * a + jitter);
    const from = wheelGroup ? wheelGroup.rotation.z : 0;
    const TWO_PI = Math.PI * 2;
    let delta = ((target - from) % TWO_PI + TWO_PI) % TWO_PI;
    const to = from + delta + TWO_PI * (5 + Math.floor(Math.random() * 3));
    spin = { start: performance.now(), from, to, index };
    spinning = true;
    sectorMeshes.forEach(m => m.material.emissive.setHex(0x000000));
    setUIEnabled(false);

    if (!renderer) {   // 無 WebGL 時仍可抽籤
      setTimeout(() => finishSpin(index), 600);
    }
  }

  function finishSpin(index) {
    spinning = false;
    spin = null;
    setUIEnabled(true);
    const winner = currentList[index];
    if (renderer) {
      sectorMeshes[index] && sectorMeshes[index].material.emissive.setHex(0x553300);
      burstConfetti();
    }
    setTimeout(() => showResult(winner), renderer ? 650 : 0);
  }

  function setUIEnabled(on) {
    document.querySelectorAll('#filter-panel input').forEach(i => (i.disabled = !on));
    $('spin-btn').disabled = !on || currentList.length === 0;
    $('spin-btn').innerHTML = on ? '<i class="fa-solid fa-dice"></i> 決定吃什麼！' : '<i class="fa-solid fa-spinner fa-spin"></i> 命運轉動中…';
  }

  /* ---------- 3D 粒子彩帶 ---------- */
  function createConfetti() {
    const COUNT = 320;
    const geo = new THREE.PlaneGeometry(0.12, 0.07);
    const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, vertexColors: false });
    const mesh = new THREE.InstancedMesh(geo, mat, COUNT);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const parts = [];
    const color = new THREE.Color();
    for (let i = 0; i < COUNT; i++) {
      color.setHex(PALETTE[i % PALETTE.length]);
      mesh.setColorAt(i, color);
      parts.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), rv: new THREE.Vector3(), life: 0 });
    }
    mesh.instanceColor.needsUpdate = true;
    mesh.visible = false;
    mesh.frustumCulled = false;
    scene.add(mesh);
    return { mesh, parts, active: false, dummy: new THREE.Object3D() };
  }

  function burstConfetti() {
    const c = confetti;
    c.parts.forEach(pt => {
      pt.p.set((Math.random() - 0.5) * 0.6, R + 0.3, 1 + Math.random() * 0.5);
      const ang = Math.random() * Math.PI * 2;
      const sp = 0.08 + Math.random() * 0.16;
      pt.v.set(Math.cos(ang) * sp, 0.12 + Math.random() * 0.18, Math.sin(ang) * sp * 0.6 + 0.04);
      pt.r.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
      pt.rv.set((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4);
      pt.life = 1;
    });
    c.active = true;
    c.mesh.visible = true;
  }

  function updateConfetti() {
    const c = confetti;
    if (!c || !c.active) return;
    let alive = 0;
    c.parts.forEach((pt, i) => {
      if (pt.life > 0) {
        pt.v.y -= 0.0065;               // 重力
        pt.v.multiplyScalar(0.985);     // 空氣阻力
        pt.p.add(pt.v);
        pt.r.x += pt.rv.x; pt.r.y += pt.rv.y; pt.r.z += pt.rv.z;
        pt.life -= 0.0055;
        alive++;
      }
      c.dummy.position.copy(pt.p);
      c.dummy.rotation.copy(pt.r);
      c.dummy.scale.setScalar(pt.life > 0 ? 1 : 0);
      c.dummy.updateMatrix();
      c.mesh.setMatrixAt(i, c.dummy.matrix);
    });
    c.mesh.instanceMatrix.needsUpdate = true;
    if (!alive) { c.active = false; c.mesh.visible = false; }
  }

  /* ---------- 拖曳改變視角 ---------- */
  const drag = { on: false, x: 0, y: 0, rx: 0, ry: 0, tx: 0, ty: 0 };
  container.addEventListener('pointerdown', (e) => {
    drag.on = true; drag.x = e.clientX; drag.y = e.clientY;
    drag.rx = drag.tx; drag.ry = drag.ty;
    container.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', (e) => {
    if (!drag.on) return;
    drag.ty = Math.max(-0.7, Math.min(0.7, drag.ry + (e.clientX - drag.x) * 0.005));
    drag.tx = Math.max(-0.6, Math.min(0.5, drag.rx + (e.clientY - drag.y) * 0.005));
  });
  const endDrag = () => { drag.on = false; };
  container.addEventListener('pointerup', endDrag);
  container.addEventListener('pointercancel', endDrag);

  /* ---------- 主迴圈 ---------- */
  const clock = { t: 0 };
  function animate(now) {
    requestAnimationFrame(animate);
    if (!renderer) return;
    clock.t = now * 0.001;

    if (spin) {
      const p = Math.min(1, (now - spin.start) / SPIN_MS);
      wheelGroup.rotation.z = spin.from + (spin.to - spin.from) * easeOutQuart(p);
      // 指針經過分隔釘時彈一下 + 音效
      const n = currentList.length, a = (Math.PI * 2) / n;
      const sector = Math.floor(((Math.PI / 2 - wheelGroup.rotation.z) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) / a);
      if (sector !== lastTickSector) { lastTickSector = sector; pointerKick = 1; if (n > 1) tickSound(); }
      if (p >= 1) finishSpin(spin.index);
    } else if (!$('result-modal').classList.contains('hidden')) {
      // 顯示結果時停住
    } else {
      wheelGroup.rotation.z += 0.0025;   // 待機微弱旋轉
    }

    pointerKick *= 0.85;
    pointer.rotation.z = -pointerKick * 0.45;

    // 視角：拖曳 + 待機漂浮，放開後慢慢回正
    if (!drag.on) { drag.tx *= 0.96; drag.ty *= 0.96; }
    holder.rotation.x += ((-0.28 + drag.tx + Math.sin(clock.t * 0.7) * 0.03) - holder.rotation.x) * 0.12;
    holder.rotation.y += ((drag.ty + Math.sin(clock.t * 0.5) * 0.05) - holder.rotation.y) * 0.12;
    holder.position.y = Math.sin(clock.t * 1.1) * 0.06;

    // 中獎扇區閃爍
    if (!spinning && !$('result-modal').classList.contains('hidden')) {
      const glow = (Math.sin(clock.t * 6) + 1) * 0.5;
      hubMat.emissive.setRGB(0.25 * glow, 0.16 * glow, 0);
    } else {
      hubMat.emissive.setRGB(0, 0, 0);
    }

    updateConfetti();
    renderer.render(scene, camera);
  }

  /* =====================================================================
   * 6. UI 事件監聽與結果呈現
   * ===================================================================== */
  function showResult(r) {
    $('r-name').textContent = r.name;
    const walkMin = Math.max(1, Math.round(r.distanceMeters / 80));
    $('r-dist').textContent = `${r.distanceMeters >= 1000 ? (r.distanceMeters / 1000).toFixed(1) + ' 公里' : r.distanceMeters + ' 公尺'}，步行約 ${walkMin} 分鐘`;
    $('r-price').textContent = r.priceRange;
    const tags = [`<span class="tag ${r.hasAC ? 'ac' : 'noac'}">${r.hasAC ? '❄️ 有冷氣' : '🌤 無冷氣'}</span>`]
      .concat(r.categories.map(c => {
        const meta = CATEGORIES.find(x => x.key === c);
        return `<span class="tag">${meta ? meta.icon : ''} ${meta && meta.label ? meta.label : c}</span>`;
      }));
    $('r-tags').innerHTML = tags.join('');
    $('r-map').href = r.googleMapUrl;
    $('result-modal').classList.remove('hidden');
  }
  function hideModal() {
    $('result-modal').classList.add('hidden');
    sectorMeshes.forEach(m => m.material.emissive.setHex(0x000000));
  }

  document.querySelectorAll('#filter-panel input').forEach(i => i.addEventListener('change', refresh));
  $('cat-all').addEventListener('click', () => { if (spinning) return; catGroup.querySelectorAll('input').forEach(i => (i.checked = true)); refresh(); });
  $('cat-none').addEventListener('click', () => { if (spinning) return; catGroup.querySelectorAll('input').forEach(i => (i.checked = false)); refresh(); });
  $('spin-btn').addEventListener('click', () => { $('filter-panel').classList.remove('open'); updateDrawerLabel(); startSpin(); });
  $('r-again').addEventListener('click', () => { hideModal(); setTimeout(startSpin, 250); });
  $('r-refilter').addEventListener('click', () => {
    hideModal();
    $('filter-panel').classList.add('open');
    updateDrawerLabel();
    $('filter-panel').scrollTop = 0;
  });
  $('result-modal').addEventListener('click', (e) => { if (e.target.id === 'result-modal') hideModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideModal();
    if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body) { e.preventDefault(); startSpin(); }
  });

  function updateDrawerLabel() {
    $('drawer-label').textContent = $('filter-panel').classList.contains('open') ? '收合篩選條件' : '展開篩選條件';
  }
  $('drawer-btn').addEventListener('click', () => { $('filter-panel').classList.toggle('open'); updateDrawerLabel(); });

  loadFilters();
  refresh();
  requestAnimationFrame(animate);
  </script>
</body>
</html>
